<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>양의 꿈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Jua&display=swap');

        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Fredoka One', 'Jua', cursive, sans-serif;
            background-color: #7ce8ff;
            position: fixed; /* Prevents bounce scroll on iOS */
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Glassmorphism UI elements */
        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* Rainbow pulsing border for invincibility state */
        @keyframes rainbow-border {
            0% { border-color: #ff4500; box-shadow: 0 0 20px #ff4500; }
            20% { border-color: #ffa500; box-shadow: 0 0 20px #ffa500; }
            40% { border-color: #ffff00; box-shadow: 0 0 20px #ffff00; }
            60% { border-color: #008000; box-shadow: 0 0 20px #008000; }
            80% { border-color: #0000ff; box-shadow: 0 0 20px #0000ff; }
            100% { border-color: #4b0082; box-shadow: 0 0 20px #4b0082; }
        }

        .invincible-active {
            animation: rainbow-border 1s infinite linear;
        }

        .btn-bounce {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-bounce:active {
            transform: scale(0.92);
        }

        /* Virtual Gamepad Buttons */
        .v-pad-btn {
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            transition: background 0.1s, transform 0.08s;
            touch-action: none;
        }
        .v-pad-btn:active, .v-pad-btn.active {
            background: rgba(255, 255, 255, 0.75);
            transform: scale(0.9);
        }
    </style>
</head>
<body class="relative w-full h-full overflow-hidden select-none">

    <!-- Canvas Container -->
    <canvas id="game-canvas"></canvas>

    <!-- Top UI Header -->
    <div class="absolute top-3 left-3 right-3 flex justify-between items-start pointer-events-none z-10">
        <!-- Score, High Score & Stage Progress -->
        <div class="glass-panel rounded-2xl p-3 md:p-4 text-white flex flex-col gap-1 min-w-[150px] md:min-w-[180px]">
            <div class="text-[10px] md:text-xs uppercase tracking-wider text-yellow-200 opacity-90">Score</div>
            <div id="score-text" class="text-2xl md:text-3xl font-black text-white drop-shadow-md">0</div>
            
            <!-- Stage Progress Bar -->
            <div class="w-full bg-black/30 h-2 md:h-2.5 rounded-full overflow-hidden mt-1">
                <div id="stage-progress-bar" class="h-full bg-gradient-to-r from-yellow-300 to-amber-400 w-0 transition-all duration-150 rounded-full"></div>
            </div>
            
            <div class="text-[10px] md:text-xs text-white/80 mt-1 flex items-center justify-between">
                <span><i class="fa-solid fa-trophy text-yellow-300"></i> Best: <span id="high-score-text">0</span></span>
                <span id="progress-percent" class="text-[9px] md:text-[10px] text-yellow-200 font-bold">0%</span>
            </div>
        </div>

        <!-- Right Header Items: Audio & Stage Level Badge -->
        <div class="flex flex-col items-end gap-2">
            <div class="flex gap-2 pointer-events-auto">
                <button id="sound-btn" class="glass-panel btn-bounce rounded-2xl w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-white text-lg md:text-xl hover:bg-white/40">
                    <i class="fa-solid fa-volume-high" id="sound-icon"></i>
                </button>
            </div>
            
            <!-- Stage Level Badge HUD -->
            <div class="glass-panel rounded-xl px-2.5 py-1 text-white flex items-center gap-1.5 pointer-events-none">
                <i class="fa-solid fa-flag-checkered text-yellow-300 text-[10px] md:text-xs"></i>
                <span class="text-[10px] md:text-xs font-bold text-yellow-200 uppercase tracking-wider">STAGE:</span>
                <span id="stage-level-text" class="text-xs md:text-sm font-black text-white">1</span>
            </div>
        </div>
    </div>

    <!-- Invincibility Gauge Bar -->
    <div id="invincible-container" class="absolute top-24 md:top-28 left-1/2 -translate-x-1/2 w-48 md:w-64 glass-panel rounded-full p-1.5 hidden z-10 invincible-active">
        <div class="flex justify-between items-center text-[10px] md:text-xs text-white font-bold px-2 mb-1">
            <span class="text-yellow-300 drop-shadow"><i class="fa-solid fa-bolt"></i> 무적 모드! (INVINCIBLE)</span>
        </div>
        <div class="w-full bg-black/30 h-2.5 md:h-3 rounded-full overflow-hidden">
            <div id="invincible-bar" class="h-full bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 w-full transition-all duration-100 rounded-full"></div>
        </div>
    </div>

    <!-- Stage Up & Combo Popup Overlay -->
    <div id="combo-popup" class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none text-center opacity-0 transition-all duration-300 transform scale-50 z-20">
        <div id="combo-text" class="text-3xl md:text-6xl font-extrabold text-yellow-300 drop-shadow-[0_4px_8px_rgba(0,0,0,0.5)] italic tracking-wider">
            3x COMBO!
        </div>
    </div>

    <!-- Mobile Virtual Pad Controls (Left, Right & Jump) -->
    <div id="mobile-controls" class="absolute bottom-5 left-4 right-4 flex justify-between items-center z-20 pointer-events-none">
        <!-- Left / Right D-Pad Controls -->
        <div class="flex gap-2 md:gap-3 pointer-events-auto">
            <button id="btn-left" class="v-pad-btn w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center text-xl md:text-2xl text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button id="btn-right" class="v-pad-btn w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center text-xl md:text-2xl text-white">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        
        <!-- Action Jump Button -->
        <button id="btn-jump" class="v-pad-btn pointer-events-auto w-20 h-14 md:w-28 md:h-16 rounded-2xl flex items-center justify-center text-base md:text-xl font-black text-white bg-amber-400/50 border-amber-200">
            <i class="fa-solid fa-angles-up mr-1 md:mr-2"></i> JUMP
        </button>
    </div>

    <!-- Start / Game Over Screen Overlay -->
    <div id="menu-modal" class="absolute inset-0 bg-black/40 backdrop-blur-md flex items-center justify-center z-30 p-4 overflow-y-auto">
        <div class="glass-panel max-w-md w-full rounded-3xl p-5 md:p-8 text-center text-white shadow-2xl relative border-2 border-white/50 max-h-[90vh] overflow-y-auto">
            
            <!-- Game Title Header -->
            <div id="modal-title-container">
                <h1 class="text-3xl md:text-5xl font-black text-white drop-shadow-lg tracking-wider mb-2">
                    🐑 양의 꿈
                </h1>
                <p class="text-white/90 text-xs md:text-base font-medium mb-4 md:mb-6">10,000점마다 스테이지 업! 모바일 터치 및 터치패드 지원</p>
            </div>

            <!-- Game Over Details -->
            <div id="game-over-details" class="hidden mb-4 md:mb-6 bg-white/10 rounded-2xl p-3 md:p-4 border border-white/20">
                <div class="text-red-300 font-bold text-base md:text-lg mb-2" id="death-reason-text">게임 오버!</div>
                <div class="grid grid-cols-2 gap-3 my-2">
                    <div class="bg-black/20 rounded-xl p-2">
                        <div class="text-[10px] md:text-xs text-white/70">최종 점수</div>
                        <div id="final-score" class="text-xl md:text-2xl font-bold text-yellow-300">0</div>
                    </div>
                    <div class="bg-black/20 rounded-xl p-2">
                        <div class="text-[10px] md:text-xs text-white/70">도달 스테이지</div>
                        <div id="final-stage" class="text-xl md:text-2xl font-bold text-amber-300">STAGE 1</div>
                    </div>
                </div>
                <div class="bg-black/20 rounded-xl p-2 mt-2">
                    <div class="text-[10px] md:text-xs text-white/70">최고 점수</div>
                    <div id="final-high-score" class="text-lg md:text-xl font-bold text-emerald-300">0</div>
                </div>
            </div>

            <!-- Controls & Instructions Guide -->
            <div class="bg-black/20 rounded-2xl p-3 md:p-4 text-left text-xs md:text-sm text-white/90 space-y-2 mb-4 md:mb-6 border border-white/10">
                <div class="font-bold text-yellow-300 text-center mb-1">🎮 조작 안내</div>
                <div class="text-[11px] md:text-xs leading-relaxed">
                    • <b>모바일 조작</b>: 화면 하단 가상 패드 버튼 또는 화면 스와이프 (좌/우/상 점프)<br>
                    • <b>키보드 조작</b>: 방향키 또는 <span class="bg-white/20 px-1.5 py-0.5 rounded font-mono text-[10px]">A</span>, <span class="bg-white/20 px-1.5 py-0.5 rounded font-mono text-[10px]">D</span>, <span class="bg-white/20 px-1.5 py-0.5 rounded font-mono text-[10px]">Space</span>
                </div>
                <hr class="border-white/10 my-1">
                <div class="grid grid-cols-3 gap-1.5 text-center text-[10px] md:text-xs">
                    <div class="p-1 rounded bg-pink-500/30 border border-pink-300/40">
                        <div class="font-bold text-pink-200">🍭 솜사탕</div>
                        <div class="text-[9px] opacity-80">+500 점</div>
                    </div>
                    <div class="p-1 rounded bg-amber-800/40 border border-amber-600/40">
                        <div class="font-bold text-amber-200">🕳️ 장애물</div>
                        <div class="text-[9px] opacity-80">부딪히면 패배</div>
                    </div>
                    <div class="p-1 rounded bg-purple-500/30 border border-purple-300/40">
                        <div class="font-bold text-purple-200">🌈 무지개풀</div>
                        <div class="text-[9px] opacity-80">무적 + 추가점수</div>
                    </div>
                </div>
            </div>

            <!-- Start / Restart Button -->
            <button id="start-btn" class="w-full py-3.5 md:py-4 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-amber-950 font-black text-lg md:text-xl rounded-2xl shadow-lg transform transition active:scale-95 border-2 border-yellow-200">
                <i class="fa-solid fa-play mr-2"></i> 게임 시작하기
            </button>
        </div>
    </div>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        // Prevent default touch moves to block screen scrolling/zooming on mobile devices
        document.addEventListener('touchmove', (e) => {
            if (e.scale !== 1) e.preventDefault();
        }, { passive: false });

        // --- Web Audio Synthesizer sound engine ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playTone(freq, type, duration, gainVal = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            playJump() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                } catch(e){}
            }

            playCollect() {
                this.playTone(880, 'sine', 0.1, 0.15);
                setTimeout(() => this.playTone(1320, 'sine', 0.15, 0.15), 60);
            }

            playPowerup() {
                const notes = [440, 554, 659, 880];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.2), idx * 60);
                });
            }

            playStageUp() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'square', 0.25, 0.18), idx * 80);
                });
            }

            playSmash() {
                this.playTone(120, 'sawtooth', 0.2, 0.3);
            }

            playGameOver() {
                const notes = [300, 260, 220, 180];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sawtooth', 0.25, 0.2), idx * 100);
                });
            }
        }

        const sound = new SoundEngine();

        // --- Game Constants & State ---
        const LANES = [-2.2, 0, 2.2]; // 3 Lanes
        const GAME_SPEED_BASE = 0.22;
        const MAX_GAME_SPEED = 0.52;
        const JUMP_GRAVITY = 0.018;
        const JUMP_FORCE = 0.36;
        const STAGE_INTERVAL = 10000;

        let scene, camera, renderer;
        let sheepGroup, sheepBody, legs = [], tail;
        let worldObjects = [];
        let particles = [];
        
        let gameState = {
            running: false,
            score: 0,
            stage: 1,
            highScore: localStorage.getItem('fluffy_hop_highscore') || 0,
            currentLane: 1,
            targetX: 0,
            posY: 0,
            velocityY: 0,
            isJumping: false,
            speed: GAME_SPEED_BASE,
            distanceRun: 0,
            invincibleTimer: 0,
            combo: 0
        };

        let lastSpawnDistance = 0;
        let legAnimAngle = 0;
        let lastAnnouncedStage = 1;

        // UI Element References
        const scoreEl = document.getElementById('score-text');
        const highScoreEl = document.getElementById('high-score-text');
        const stageLevelEl = document.getElementById('stage-level-text');
        const stageProgressBar = document.getElementById('stage-progress-bar');
        const progressPercentEl = document.getElementById('progress-percent');
        const menuModal = document.getElementById('menu-modal');
        const startBtn = document.getElementById('start-btn');
        const gameOverDetails = document.getElementById('game-over-details');
        const finalScoreEl = document.getElementById('final-score');
        const finalStageEl = document.getElementById('final-stage');
        const finalHighScoreEl = document.getElementById('final-high-score');
        const deathReasonText = document.getElementById('death-reason-text');
        const invincibleContainer = document.getElementById('invincible-container');
        const invincibleBar = document.getElementById('invincible-bar');
        const comboPopup = document.getElementById('combo-popup');
        const comboText = document.getElementById('combo-text');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');

        highScoreEl.innerText = gameState.highScore;

        function disposeObject(obj) {
            if (!obj) return;
            obj.traverse((child) => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.dispose());
                    } else {
                        child.material.dispose();
                    }
                }
            });
        }

        // --- Init Three.js Scene ---
        function initScene() {
            const container = document.getElementById('game-canvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCameraAspect();

            renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 40;
            dirLight.shadow.camera.left = -10;
            dirLight.shadow.camera.right = 10;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            scene.add(dirLight);

            createTrack();
            createSheep();
            createEnvironment();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 200));
            setupControls();
        }

        // Adjust camera FOV / Position based on portrait vs landscape mobile screens
        function updateCameraAspect() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            
            if (aspect < 0.8) {
                // Mobile Portrait mode: Pull camera back slightly for better lane visibility
                camera.position.set(0, 5.5, 9.5);
                camera.fov = 65;
            } else {
                // Landscape / Desktop mode
                camera.position.set(0, 4.5, 8);
                camera.fov = 60;
            }
            camera.lookAt(0, 1, -2);
            camera.updateProjectionMatrix();
        }

        let trackSegments = [];
        function createTrack() {
            const trackWidth = 8;
            const segmentLength = 20;

            for (let i = 0; i < 5; i++) {
                const segment = new THREE.Group();
                segment.position.z = -i * segmentLength;

                const geo = new THREE.PlaneGeometry(trackWidth, segmentLength);
                const mat = new THREE.MeshLambertMaterial({ color: i % 2 === 0 ? 0x7ec850 : 0x73b845 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.receiveShadow = true;
                segment.add(mesh);

                const borderGeo = new THREE.BoxGeometry(0.4, 0.3, segmentLength);
                const borderMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
                
                const leftBorder = new THREE.Mesh(borderGeo, borderMat);
                leftBorder.position.set(-trackWidth/2 - 0.2, 0.15, 0);
                segment.add(leftBorder);

                const rightBorder = new THREE.Mesh(borderGeo, borderMat);
                rightBorder.position.set(trackWidth/2 + 0.2, 0.15, 0);
                segment.add(rightBorder);

                scene.add(segment);
                trackSegments.push(segment);
            }
        }

        function createEnvironment() {
            for (let i = 0; i < 15; i++) {
                const cloud = createCloud();
                cloud.position.set(
                    (Math.random() - 0.5) * 40,
                    8 + Math.random() * 6,
                    -Math.random() * 60
                );
                scene.add(cloud);
            }
        }

        function createCloud() {
            const group = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
            const count = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                const geo = new THREE.DodecahedronGeometry(1 + Math.random() * 0.8, 1);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(i * 1.2, Math.random() * 0.3, Math.random() * 0.3);
                group.add(mesh);
            }
            return group;
        }

        function createSheep() {
            sheepGroup = new THREE.Group();

            const woolMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.9, metalness: 0.1 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });

            sheepBody = new THREE.Group();

            const bodyCenter = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7, 1), woolMat);
            bodyCenter.castShadow = true;
            sheepBody.add(bodyCenter);

            const puffOffsets = [
                [-0.3, 0.2, 0.2], [0.3, 0.2, 0.2], [-0.3, 0.2, -0.2], [0.3, 0.2, -0.2],
                [0, 0.4, 0], [0, -0.1, 0.4], [0, 0, -0.4]
            ];
            puffOffsets.forEach(offset => {
                const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45, 1), woolMat);
                puff.position.set(...offset);
                puff.castShadow = true;
                sheepBody.add(puff);
            });

            tail = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2, 1), woolMat);
            tail.position.set(0, 0.15, 0.7);
            sheepBody.add(tail);

            const headGroup = new THREE.Group();
            headGroup.position.set(0, 0.3, -0.75);

            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.5), skinMat);
            headMesh.castShadow = true;
            headGroup.add(headMesh);

            const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28, 1), woolMat);
            crown.position.set(0, 0.25, 0);
            headGroup.add(crown);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

            [-0.15, 0.15].forEach(x => {
                const eye = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.05), eyeMat);
                eye.position.set(x, 0.08, -0.26);
                const pupil = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.06), pupilMat);
                pupil.position.set(x * 1.1, 0.08, -0.27);
                headGroup.add(eye);
                headGroup.add(pupil);
            });

            const earGeo = new THREE.BoxGeometry(0.3, 0.1, 0.12);
            const leftEar = new THREE.Mesh(earGeo, skinMat);
            leftEar.position.set(-0.3, 0.1, 0);
            leftEar.rotation.z = -0.3;
            const rightEar = new THREE.Mesh(earGeo, skinMat);
            rightEar.position.set(0.3, 0.1, 0);
            rightEar.rotation.z = 0.3;
            headGroup.add(leftEar);
            headGroup.add(rightEar);

            sheepBody.add(headGroup);

            const legGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.5);
            const legPositions = [
                [-0.35, -0.45, 0.3],
                [0.35, -0.45, 0.3],
                [-0.35, -0.45, -0.3],
                [0.35, -0.45, -0.3]
            ];

            legs = [];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, skinMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                sheepBody.add(leg);
                legs.push(leg);
            });

            sheepGroup.add(sheepBody);
            sheepGroup.position.set(LANES[gameState.currentLane], 0.6, 0);
            scene.add(sheepGroup);
        }

        function spawnWorldObject() {
            const laneIndex = Math.floor(Math.random() * 3);
            const posX = LANES[laneIndex];
            const posZ = -45;

            const scoreFactor = Math.min(gameState.score / 50000, 1.0);

            const probRainbow = Math.max(0.02, 0.12 - (0.10 * scoreFactor));
            const probCotton = Math.max(0.13, 0.28 - (0.15 * scoreFactor));

            const rand = Math.random();
            let type;

            if (rand < probRainbow) {
                type = 'RAINBOW';
            } else if (rand < probRainbow + probCotton) {
                type = 'COTTON';
            } else {
                type = (Math.random() > 0.45) ? 'FENCE' : 'PIT';
            }

            const objGroup = new THREE.Group();
            objGroup.userData = { type: type, lane: laneIndex, active: true };
            objGroup.position.set(posX, 0, posZ);

            if (type === 'FENCE') {
                const woodMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
                const postGeo = new THREE.BoxGeometry(0.15, 0.9, 0.15);
                const railGeo = new THREE.BoxGeometry(1.6, 0.15, 0.1);

                const p1 = new THREE.Mesh(postGeo, woodMat); p1.position.set(-0.7, 0.45, 0); p1.castShadow = true;
                const p2 = new THREE.Mesh(postGeo, woodMat); p2.position.set(0.7, 0.45, 0); p2.castShadow = true;
                const r1 = new THREE.Mesh(railGeo, woodMat); r1.position.set(0, 0.6, 0); r1.castShadow = true;
                const r2 = new THREE.Mesh(railGeo, woodMat); r2.position.set(0, 0.3, 0); r2.castShadow = true;

                objGroup.add(p1, p2, r1, r2);
            } 
            else if (type === 'PIT') {
                const pitGeo = new THREE.PlaneGeometry(1.6, 2.2);
                const pitMat = new THREE.MeshBasicMaterial({ color: 0x1a1105 });
                const pitMesh = new THREE.Mesh(pitGeo, pitMat);
                pitMesh.rotation.x = -Math.PI / 2;
                pitMesh.position.y = 0.02;
                objGroup.add(pitMesh);

                const edgeGeo = new THREE.BoxGeometry(1.7, 0.05, 2.3);
                const edgeMat = new THREE.MeshLambertMaterial({ color: 0x3d2314 });
                const edge = new THREE.Mesh(edgeGeo, edgeMat);
                edge.position.y = 0.01;
                objGroup.add(edge);
            } 
            else if (type === 'COTTON') {
                const candyGroup = new THREE.Group();
                const stickGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.8);
                const stickMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const stick = new THREE.Mesh(stickGeo, stickMat);
                stick.position.y = 0.4;

                const fluffGeo = new THREE.DodecahedronGeometry(0.45, 1);
                const fluffMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.3 });
                const fluff = new THREE.Mesh(fluffGeo, fluffMat);
                fluff.position.y = 0.8;
                fluff.castShadow = true;

                candyGroup.add(stick, fluff);
                candyGroup.position.y = 0.5;
                objGroup.add(candyGroup);
            } 
            else if (type === 'RAINBOW') {
                const grassGroup = new THREE.Group();
                const colors = [0xff0000, 0xff7f00, 0xffff00, 0x00ff00, 0x0000ff, 0x8b00ff];
                
                for (let i = 0; i < 7; i++) {
                    const bladeGeo = new THREE.ConeGeometry(0.12, 0.7, 4);
                    const bladeMat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length] });
                    const blade = new THREE.Mesh(bladeGeo, bladeMat);
                    blade.position.set((Math.random() - 0.5) * 0.5, 0.35, (Math.random() - 0.5) * 0.5);
                    blade.rotation.z = (Math.random() - 0.5) * 0.4;
                    grassGroup.add(blade);
                }
                
                const auraGeo = new THREE.SphereGeometry(0.6, 16, 16);
                const auraMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
                const aura = new THREE.Mesh(auraGeo, auraMat);
                aura.position.y = 0.35;
                grassGroup.add(aura);

                objGroup.add(grassGroup);
            }

            if (Math.random() > 0.4) {
                const sideTree = createTree();
                sideTree.position.set(Math.random() > 0.5 ? -5.5 : 5.5, 0, 0);
                objGroup.add(sideTree);
            }

            scene.add(objGroup);
            worldObjects.push(objGroup);
        }

        function createTree() {
            const tree = new THREE.Group();
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.2), trunkMat);
            trunk.position.y = 0.6;
            trunk.castShadow = true;

            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1, 2, 5), leavesMat);
            leaves.position.y = 1.8;
            leaves.castShadow = true;

            tree.add(trunk, leaves);
            return tree;
        }

        function createExplosion(x, y, z, colorHex, count = 15) {
            for (let i = 0; i < count; i++) {
                const pGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
                const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set(x, y, z);
                
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 0.3 + 0.1,
                    (Math.random() - 0.5) * 0.3
                );

                scene.add(p);
                particles.push({ mesh: p, vel: velocity, life: 1.0 });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.vel);
                p.vel.y -= 0.015;
                p.life -= 0.03;
                p.mesh.scale.multiplyScalar(0.95);

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    disposeObject(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        // --- Controls & Touch Gesture Setup ---
        function setupControls() {
            // Keyboard controls
            window.addEventListener('keydown', (e) => {
                if (!gameState.running) return;

                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    moveLane(-1);
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    moveLane(1);
                } else if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                    jump();
                }
            });

            // Onscreen Virtual Button Listeners with Touch Events
            const bindVirtualBtn = (elemId, action) => {
                const btn = document.getElementById(elemId);
                const trigger = (e) => {
                    e.preventDefault();
                    if (!gameState.running) return;
                    action();
                    btn.classList.add('active');
                    setTimeout(() => btn.classList.remove('active'), 100);
                };
                btn.addEventListener('touchstart', trigger, { passive: false });
                btn.addEventListener('click', (e) => {
                    if (e.pointerType !== 'touch') trigger(e);
                });
            };

            bindVirtualBtn('btn-left', () => moveLane(-1));
            bindVirtualBtn('btn-right', () => moveLane(1));
            bindVirtualBtn('btn-jump', () => jump());

            // Swipe Controls on Screen Area
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;

            window.addEventListener('touchstart', (e) => {
                if (e.target.closest('#mobile-controls') || e.target.closest('button')) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (!gameState.running || e.target.closest('#mobile-controls') || e.target.closest('button')) return;
                
                const deltaX = e.changedTouches[0].clientX - touchStartX;
                const deltaY = e.changedTouches[0].clientY - touchStartY;
                const elapsedTime = Date.now() - touchStartTime;

                if (elapsedTime < 300) { // Fast swipe or tap
                    if (Math.abs(deltaX) > 25 && Math.abs(deltaX) > Math.abs(deltaY)) {
                        if (deltaX > 0) moveLane(1);
                        else moveLane(-1);
                    } else if (deltaY < -25 || Math.abs(deltaX) < 15) {
                        // Swipe Up OR Tap triggers Jump
                        jump();
                    }
                }
            }, { passive: true });

            soundBtn.addEventListener('click', () => {
                sound.init();
                sound.muted = !sound.muted;
                soundIcon.className = sound.muted ? 'fa-solid fa-volume-xmark text-red-300' : 'fa-solid fa-volume-high text-white';
            });

            startBtn.addEventListener('click', () => {
                sound.init();
                startGame();
            });
        }

        function moveLane(dir) {
            const nextLane = gameState.currentLane + dir;
            if (nextLane >= 0 && nextLane <= 2) {
                gameState.currentLane = nextLane;
                gameState.targetX = LANES[gameState.currentLane];
            }
        }

        function jump() {
            if (!gameState.isJumping) {
                gameState.isJumping = true;
                gameState.velocityY = JUMP_FORCE;
                sound.playJump();
            }
        }

        function startGame() {
            worldObjects.forEach(obj => {
                scene.remove(obj);
                disposeObject(obj);
            });
            worldObjects = [];

            particles.forEach(p => {
                scene.remove(p.mesh);
                disposeObject(p.mesh);
            });
            particles = [];

            lastSpawnDistance = 0;
            lastAnnouncedStage = 1;

            gameState.running = true;
            gameState.score = 0;
            gameState.stage = 1;
            gameState.currentLane = 1;
            gameState.targetX = LANES[1];
            gameState.posY = 0;
            gameState.velocityY = 0;
            gameState.isJumping = false;
            gameState.speed = GAME_SPEED_BASE;
            gameState.distanceRun = 0;
            gameState.invincibleTimer = 0;
            gameState.combo = 0;

            sheepGroup.position.set(LANES[1], 0.6, 0);
            sheepGroup.rotation.set(0, 0, 0);
            sheepBody.rotation.set(0, 0, 0);

            menuModal.classList.add('hidden');
            invincibleContainer.classList.add('hidden');
            scoreEl.innerText = '0';
            stageLevelEl.innerText = '1';
            stageProgressBar.style.width = '0%';
            progressPercentEl.innerText = '0%';
        }

        function gameOver(reason) {
            gameState.running = false;
            sound.playGameOver();

            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('fluffy_hop_highscore', gameState.highScore);
                highScoreEl.innerText = gameState.highScore;
            }

            deathReasonText.innerText = reason;
            finalScoreEl.innerText = gameState.score.toLocaleString();
            finalStageEl.innerText = `STAGE ${gameState.stage}`;
            finalHighScoreEl.innerText = gameState.highScore.toLocaleString();

            document.getElementById('modal-title-container').classList.add('hidden');
            gameOverDetails.classList.remove('hidden');
            startBtn.innerHTML = '<i class="fa-solid fa-rotate-right mr-2"></i> 다시 도전하기';
            menuModal.classList.remove('hidden');
        }

        function showAnnouncement(text) {
            comboText.innerText = text;
            comboPopup.classList.remove('opacity-0', 'scale-50');
            comboPopup.classList.add('opacity-100', 'scale-110');

            setTimeout(() => {
                comboPopup.classList.remove('opacity-100', 'scale-110');
                comboPopup.classList.add('opacity-0', 'scale-50');
            }, 1000);
        }

        // --- Main Game Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameState.running) {
                gameState.distanceRun += gameState.speed;
                gameState.score += Math.round(gameState.speed * 45);
                scoreEl.innerText = gameState.score.toLocaleString();

                gameState.stage = Math.floor(gameState.score / STAGE_INTERVAL) + 1;
                stageLevelEl.innerText = `${gameState.stage}`;

                const currentStageProgress = gameState.score % STAGE_INTERVAL;
                const progressPct = Math.min(100, (currentStageProgress / STAGE_INTERVAL) * 100);
                stageProgressBar.style.width = `${progressPct}%`;
                progressPercentEl.innerText = `${Math.floor(progressPct)}%`;

                if (gameState.stage > lastAnnouncedStage) {
                    lastAnnouncedStage = gameState.stage;
                    sound.playStageUp();
                    showAnnouncement(`STAGE ${gameState.stage}! 🎉`);
                }

                const speedIncrement = (gameState.stage - 1) * 0.045 + (gameState.score / 100000) * 0.05;
                gameState.speed = Math.min(GAME_SPEED_BASE + speedIncrement, MAX_GAME_SPEED);

                trackSegments.forEach(segment => {
                    segment.position.z += gameState.speed;
                    if (segment.position.z > 10) {
                        segment.position.z -= 5 * 20;
                    }
                });

                if (gameState.distanceRun - lastSpawnDistance > 8) {
                    spawnWorldObject();
                    lastSpawnDistance = gameState.distanceRun;
                }

                sheepGroup.position.x += (gameState.targetX - sheepGroup.position.x) * 0.25;

                if (gameState.isJumping) {
                    gameState.posY += gameState.velocityY;
                    gameState.velocityY -= JUMP_GRAVITY;

                    if (gameState.posY <= 0) {
                        gameState.posY = 0;
                        gameState.velocityY = 0;
                        gameState.isJumping = false;
                    }
                }
                sheepGroup.position.y = 0.6 + gameState.posY;

                if (!gameState.isJumping) {
                    legAnimAngle += gameState.speed * 1.5;
                    legs[0].rotation.x = Math.sin(legAnimAngle) * 0.6;
                    legs[1].rotation.x = -Math.sin(legAnimAngle) * 0.6;
                    legs[2].rotation.x = -Math.sin(legAnimAngle) * 0.6;
                    legs[3].rotation.x = Math.sin(legAnimAngle) * 0.6;
                    if (tail) tail.rotation.y = Math.sin(legAnimAngle * 2) * 0.4;
                } else {
                    legs.forEach(l => l.rotation.x = -0.3);
                }

                if (gameState.invincibleTimer > 0) {
                    gameState.invincibleTimer -= 0.016;
                    const pct = Math.max(0, (gameState.invincibleTimer / 5.0) * 100);
                    invincibleBar.style.width = `${pct}%`;

                    sheepBody.rotation.y += 0.1;

                    if (Math.random() > 0.4) {
                        const rainbowColors = [0xff0000, 0xffff00, 0x00ff00, 0x00ffff, 0xff00ff];
                        const randomColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
                        createExplosion(sheepGroup.position.x, sheepGroup.position.y, sheepGroup.position.z + 0.5, randomColor, 2);
                    }

                    if (gameState.invincibleTimer <= 0) {
                        invincibleContainer.classList.add('hidden');
                        sheepBody.rotation.y = 0;
                    }
                }

                for (let i = worldObjects.length - 1; i >= 0; i--) {
                    const obj = worldObjects[i];
                    obj.position.z += gameState.speed;

                    if (obj.userData.type === 'COTTON' || obj.userData.type === 'RAINBOW') {
                        obj.rotation.y += 0.04;
                    }

                    if (Math.abs(obj.position.z - sheepGroup.position.z) < 0.8 && obj.userData.lane === gameState.currentLane && obj.userData.active) {
                        
                        if (obj.userData.type === 'COTTON') {
                            obj.userData.active = false;
                            scene.remove(obj);
                            disposeObject(obj);
                            worldObjects.splice(i, 1);
                            sound.playCollect();
                            gameState.score += 500;
                            createExplosion(sheepGroup.position.x, sheepGroup.position.y + 0.5, sheepGroup.position.z, 0xffb6c1, 12);
                            continue;
                        }

                        if (obj.userData.type === 'RAINBOW') {
                            obj.userData.active = false;
                            scene.remove(obj);
                            disposeObject(obj);
                            worldObjects.splice(i, 1);
                            sound.playPowerup();
                            gameState.score += 1000;
                            gameState.invincibleTimer = 5.0;
                            invincibleContainer.classList.remove('hidden');
                            showAnnouncement('무적 타임! 🌈');
                            createExplosion(sheepGroup.position.x, sheepGroup.position.y + 0.5, sheepGroup.position.z, 0x00ffff, 20);
                            continue;
                        }

                        if (obj.userData.type === 'FENCE') {
                            if (gameState.invincibleTimer > 0) {
                                obj.userData.active = false;
                                scene.remove(obj);
                                disposeObject(obj);
                                worldObjects.splice(i, 1);
                                sound.playSmash();
                                gameState.score += 300;
                                createExplosion(sheepGroup.position.x, sheepGroup.position.y + 0.5, sheepGroup.position.z, 0x8b4513, 15);
                            } else if (gameState.posY < 0.4) {
                                gameOver('울타리에 부딪혔습니다! 💥');
                                createExplosion(sheepGroup.position.x, sheepGroup.position.y, sheepGroup.position.z, 0xff0000, 25);
                            }
                        }

                        if (obj.userData.type === 'PIT') {
                            if (gameState.invincibleTimer > 0) {
                                // Safe
                            } else if (gameState.posY < 0.2) {
                                gameOver('구덩이에 빠졌습니다! 🕳️');
                                createExplosion(sheepGroup.position.x, sheepGroup.position.y - 0.3, sheepGroup.position.z, 0x3d2314, 25);
                            }
                        }
                    }

                    if (obj.position.z > 8) {
                        scene.remove(obj);
                        disposeObject(obj);
                        worldObjects.splice(i, 1);
                    }
                }
            }

            updateParticles();

            camera.position.x += (sheepGroup.position.x * 0.3 - camera.position.x) * 0.1;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            updateCameraAspect();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function() {
            initScene();
            animate();
        };
    </script>
</body>
